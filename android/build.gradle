allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExtension = subproject.extensions.findByName("android")
        if (androidExtension != null && androidExtension.hasProperty("namespace")) {
            def currentNamespace = androidExtension.namespace
            if (currentNamespace == null || currentNamespace.toString().trim().isEmpty()) {
                def manifestFile = androidExtension.sourceSets?.main?.manifest?.srcFile
                if (manifestFile?.exists()) {
                    def manifestText = manifestFile.getText('UTF-8')
                    def packageMatcher = manifestText =~ /package="([^"]+)"/
                    if (packageMatcher.find()) {
                        androidExtension.namespace = packageMatcher.group(1)
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
