name: mbm_elearning
description: mbm_elearning, A notes sharing platform.

version: 7.1.4+21

environment:
  sdk: ">=3.2.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
# flutter pub upgrade --major-versions
  cupertino_icons: ^1.0.6
  uuid: ^4.2.2
  http: ^1.1.2
  firebase_core: ^3.15.2
  firebase_analytics: ^11.6.0
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1 # need to setup with double condition
  share_plus: ^12.0.2
  carousel_slider: ^5.1.2
  firebase_messaging: ^15.2.10
  flutter_linkify: ^6.0.0
  introduction_screen: ^4.0.0
  sqflite: ^2.4.2 # android ios
  connectivity_plus: ^5.0.2
  cloud_firestore: ^5.6.12
  shared_preferences: ^2.5.5
  firebase_dynamic_links: ^6.1.10
  flutter_svg: ^2.2.4
  permission_handler: ^12.0.1 # android and ios // need to setup with double condition
  provider: ^6.1.1
  scrollable_positioned_list: ^0.3.8
  linkfy_text: ^1.1.5
  googleapis: ^16.0.0
  file_picker: ^10.3.10
  googleapis_auth: ^2.0.0
  html: ^0.15.4
  flutter_html: ^3.0.0-alpha.5
  flutter_html_iframe: ^3.0.0-alpha.5
  flutter_html_svg: ^3.0.0-alpha.5
  flutter_html_table: ^3.0.0-alpha.5
  flutter_html_video: ^3.0.0-alpha.5
  dropdown_search: ^5.0.2
  html_editor_enhanced: ^2.5.1 # warning flutter build web --web-renderer html
  awesome_notifications: ^0.10.1 #android ios
  date_time_picker: ^2.1.0
  firebase_in_app_messaging: ^0.8.1+10 #android ios
  tutorial_coach_mark: ^1.2.11
  lottie: any
  path_provider: ^2.1.5
  webview_flutter: ^4.13.1
  flex_color_scheme: ^8.3.1
  video_player: ^2.10.1
  


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.2.1

dependency_overrides:
  archive: ^4.0.9
  intl: ^0.20.2

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/rive/
    - assets/lottie/
    - assets/service-account.json

  fonts:
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous-Regular.ttf
  
# flutter pub run flutter_flavorizr -p android:buildGradle,android:androidManifest
flavorizr:
  app:
    android:
      flavorDimensions: "mbm-elearning-type"
    ios:

  flavors:
    mprod:
      app:
        name: "MBM Elearning"
      android:
        applicationId: "com.mbm.elereaning.mbmecj"
        firebase:
          config: ".firebase/mprod/google-services.json"
      ios:
        bundleId: "com.mbm.elereaning.mbmecj"

    mdev:
      app:
        name: "MBM Elearning Dev"
      android:
        applicationId: "com.mbm.elereaning.mbmecj.dev"
        firebase:
          config: ".firebase/mdev/google-services.json"
      ios:
        bundleId: "com.mbm.elereaning.mbmecj.dev"

# flutter build apk --flavor mprod -t lib/main_mprod.dart
# flutter build apk --flavor mdev -t lib/main_mdev.dart
# flutter build appbundle --flavor mprod -t lib/main_mprod.dart

# flutter run --flavor mdev -t lib/main_mdev.dart
# flutter run --web-renderer html --flavor mdev -t lib/main_mdev.dart
